name: Run Unity Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed so game-ci can publish a check-run summary of the test results on PRs.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run EditMode Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository. LFS is intentionally skipped here: EditMode tests build
      #    everything in-memory (no .fbx/.blend/.glb loads), and fetching real LFS content
      #    isn't worth the bandwidth quota this repo is already exhausting on build-apk.yml.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # 2. Cache the Unity Library folder to speed up future runs
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-
            Library-

      # 3. Run EditMode tests via GameCI
      #    (Unity version is auto-detected from ProjectSettings/ProjectVersion.txt)
      - name: Run Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # 4. Upload the NUnit results XML as a downloadable artifact, even on failure
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: TestResults
          if-no-files-found: warn
